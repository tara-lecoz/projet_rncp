<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord exploitant - Bennes AMP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Déchetteries MAMP — Tableau de bord Exploitant</span>
  </div>
</nav>

<div class="container-fluid px-4 pb-5">

  <!-- Cartes KPI -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <div class="text-muted small text-uppercase">Total</div>
          <div class="fs-2 fw-bold" id="kpiTotal">0</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card shadow-sm border-0 border-start border-secondary border-4">
        <div class="card-body">
          <div class="text-muted small text-uppercase">En attente</div>
          <div class="fs-2 fw-bold" id="kpiEnAttente">0</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card shadow-sm border-0 border-start border-success border-4">
        <div class="card-body">
          <div class="text-muted small text-uppercase">Traitées</div>
          <div class="fs-2 fw-bold" id="kpiTraitees">0</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card shadow-sm border-0 border-start border-danger border-4">
        <div class="card-body">
          <div class="text-muted small text-uppercase">Annulées</div>
          <div class="fs-2 fw-bold" id="kpiAnnulees">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filtres -->
  <div class="row g-2 align-items-end mb-3">
    <div class="col-auto">
      <label for="filtreStatut" class="form-label mb-0 small">Statut</label>
      <select id="filtreStatut" class="form-select">
        <option value="">Tous</option>
        <option value="EN_ATTENTE">En attente</option>
        <option value="TRAITEE">Traitée</option>
        <option value="ANNULEE">Annulée</option>
      </select>
    </div>
    <div class="col-auto flex-grow-1" style="max-width: 320px;">
      <label for="champRecherche" class="form-label mb-0 small">Recherche</label>
      <input
        type="text"
        id="champRecherche"
        class="form-control"
        placeholder="N° de commande ou déchetterie"
      >
    </div>
    <div class="col-auto">
      <button id="btnReinitialiser" class="btn btn-outline-secondary">Réinitialiser</button>
    </div>
    <div class="col-auto ms-auto">
      <button id="btnActualiser" class="btn btn-outline-primary">Actualiser</button>
    </div>
  </div>

  <div id="zoneMessage"></div>

  <div class="table-responsive shadow-sm bg-white rounded">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th>N° commande</th>
          <th>Déchetterie</th>
          <th>Type de demande</th>
          <th>Détail matières</th>
          <th>Commentaire</th>
          <th>Statut</th>
          <th>Date demande</th>
          <th>Dernière modif.</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="corpsTableau">
        <tr><td colspan="9" class="text-center text-muted py-4">Chargement...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const API_BASE_URL = window.location.origin;

  const corpsTableau = document.getElementById("corpsTableau");
  const zoneMessage = document.getElementById("zoneMessage");
  const filtreStatut = document.getElementById("filtreStatut");
  const champRecherche = document.getElementById("champRecherche");

  const LIBELLES_STATUT = {
    EN_ATTENTE: { texte: "En attente", classe: "bg-secondary" },
    TRAITEE: { texte: "Traitée", classe: "bg-success" },
    ANNULEE: { texte: "Annulée", classe: "bg-danger" },
  };

  const LIBELLES_TYPE = {
    SOUS_TRAITANCE: "Sous-traitance",
    METROPOLE_PREVISIONNEL: "Métropole prévisionnel",
    METROPOLE_PONCTUEL: "Métropole ponctuel",
    ANNULATION: "Annulation",
  };

  let commandesActuelles = [];

  function afficherMessage(type, texte) {
    zoneMessage.innerHTML = `<div class="alert alert-${type}">${texte}</div>`;
    setTimeout(() => { zoneMessage.innerHTML = ""; }, 4000);
  }

  function formaterDate(isoString) {
    return new Date(isoString).toLocaleString("fr-FR");
  }

  function calculerEtAfficherKpi(commandes) {
    document.getElementById("kpiTotal").textContent = commandes.length;
    document.getElementById("kpiEnAttente").textContent =
      commandes.filter((c) => c.statut === "EN_ATTENTE").length;
    document.getElementById("kpiTraitees").textContent =
      commandes.filter((c) => c.statut === "TRAITEE").length;
    document.getElementById("kpiAnnulees").textContent =
      commandes.filter((c) => c.statut === "ANNULEE").length;
  }

  function construireLigne(commande) {
    const estAnnulee = commande.statut === "ANNULEE";
    const estTraitee = commande.statut === "TRAITEE";
    const infoStatut = LIBELLES_STATUT[commande.statut] || { texte: commande.statut, classe: "bg-secondary" };

    const ligne = document.createElement("tr");
    // Règle CSS obligatoire pour les commandes annulées.
    if (estAnnulee) {
      ligne.className = "table-danger text-decoration-line-through";
    }

    ligne.innerHTML = `
      <td>${commande.numero_commande}</td>
      <td>${commande.dechetterie_nom}</td>
      <td>${LIBELLES_TYPE[commande.type_demande] || commande.type_demande}</td>
      <td>${commande.details_matieres ?? "-"}</td>
      <td>${commande.commentaire ?? "-"}</td>
      <td><span class="badge ${infoStatut.classe}">${infoStatut.texte}</span></td>
      <td>${formaterDate(commande.date_demande)}</td>
      <td>${formaterDate(commande.date_modification)}</td>
      <td class="text-nowrap"></td>
    `;

    const celluleActions = ligne.querySelector("td:last-child");

    if (!estAnnulee) {
      if (!estTraitee) {
        const btnTraiter = document.createElement("button");
        btnTraiter.className = "btn btn-sm btn-success me-1";
        btnTraiter.textContent = "Traiter";
        btnTraiter.addEventListener("click", () => changerStatut(commande.numero_commande, "TRAITEE"));
        celluleActions.appendChild(btnTraiter);
      }

      const btnAnnuler = document.createElement("button");
      btnAnnuler.className = "btn btn-sm btn-danger";
      btnAnnuler.textContent = "Annuler";
      btnAnnuler.addEventListener("click", () => changerStatut(commande.numero_commande, "ANNULEE"));
      celluleActions.appendChild(btnAnnuler);
    } else {
      celluleActions.textContent = "—";
    }

    return ligne;
  }

  function appliquerFiltresEtAfficher() {
    const statutSelectionne = filtreStatut.value;
    const recherche = champRecherche.value.trim().toLowerCase();

    const commandesFiltrees = commandesActuelles.filter((commande) => {
      const correspondStatut = !statutSelectionne || commande.statut === statutSelectionne;
      const correspondRecherche =
        !recherche ||
        commande.numero_commande.toLowerCase().includes(recherche) ||
        commande.dechetterie_nom.toLowerCase().includes(recherche);
      return correspondStatut && correspondRecherche;
    });

    corpsTableau.innerHTML = "";
    if (commandesFiltrees.length === 0) {
      corpsTableau.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-4">Aucune commande ne correspond aux filtres.</td></tr>`;
      return;
    }
    commandesFiltrees.forEach((commande) => corpsTableau.appendChild(construireLigne(commande)));
  }

  async function changerStatut(numeroCommande, nouveauStatut) {
    try {
      const reponse = await fetch(
        `${API_BASE_URL}/api/commandes/${encodeURIComponent(numeroCommande)}/status`,
        {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ statut: nouveauStatut }),
        }
      );
      if (!reponse.ok) {
        const erreur = await reponse.json().catch(() => ({}));
        throw new Error(erreur.detail || "Échec de la mise à jour du statut.");
      }
      afficherMessage("success", `Commande ${numeroCommande} mise à jour.`);
      await chargerCommandes();
    } catch (erreur) {
      afficherMessage("danger", erreur.message);
    }
  }

  async function chargerCommandes() {
    try {
      const reponse = await fetch(`${API_BASE_URL}/api/commandes`);
      if (!reponse.ok) throw new Error("Impossible de récupérer les commandes.");

      commandesActuelles = await reponse.json();
      calculerEtAfficherKpi(commandesActuelles);
      appliquerFiltresEtAfficher();
    } catch (erreur) {
      corpsTableau.innerHTML = `<tr><td colspan="9" class="text-center text-danger py-4">${erreur.message}</td></tr>`;
    }
  }

  filtreStatut.addEventListener("change", appliquerFiltresEtAfficher);
  champRecherche.addEventListener("input", appliquerFiltresEtAfficher);
  document.getElementById("btnActualiser").addEventListener("click", chargerCommandes);
  document.getElementById("btnReinitialiser").addEventListener("click", () => {
    filtreStatut.value = "";
    champRecherche.value = "";
    appliquerFiltresEtAfficher();
  });

  // Rafraîchissement automatique pour le suivi temps réel.
  setInterval(chargerCommandes, 15000);

  chargerCommandes();
</script>

</body>
</html>
